name: Build Windows application

on:
  push:
    tags:
      - '**'

permissions:
  contents: read

jobs:
  check-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Check isolated core behavior on Linux
        run: dotnet run --project tests/BatteryCharge.Checks/BatteryCharge.Checks.csproj -c Release

  build-windows:
    needs: check-core
    runs-on: windows-latest
    strategy:
      matrix:
        self-contained: [false, true]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Check core behavior on Windows
        run: dotnet run --project tests/BatteryCharge.Checks/BatteryCharge.Checks.csproj -c Release
      - name: Check Windows UI with simulated device and startup registration
        run: dotnet run --project tests/BatteryCharge.UiChecks/BatteryCharge.UiChecks.csproj -c Release -- artifacts/ui
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: BatteryCharge-ui-self-contained-${{ matrix.self-contained }}
          path: artifacts/ui/
          if-no-files-found: warn
      - name: Publish Windows x64 application
        run: >-
          dotnet publish src/BatteryCharge.App/BatteryCharge.App.csproj
          -c Release -r win-x64 --self-contained ${{ matrix.self-contained }}
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:PublishTrimmed=false -p:DebugType=embedded -o artifacts/app
      - uses: actions/upload-artifact@v7
        with:
          name: BatteryCharge-win-x64-self-contained-${{ matrix.self-contained }}
          path: artifacts/app/
          if-no-files-found: error
