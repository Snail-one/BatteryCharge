name: Build Windows application

on:
  push:
    tags:
      - '**'
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional version (e.g. 1.0.1-rc.1); blank uses 1.0.0-manual.<run number>'
        required: false
        type: string

permissions:
  contents: read

jobs:
  check-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Check isolated core behavior on Linux
        run: dotnet run --project tests/BatteryCharge.Checks/BatteryCharge.Checks.csproj -c Release

  build-windows:
    needs: check-core
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Resolve build version
        id: release
        env:
          MANUAL_VERSION: ${{ inputs.version }}
        shell: pwsh
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            $version = "$env:MANUAL_VERSION".Trim()
            if (-not $version) { $version = "1.0.0-manual.$env:GITHUB_RUN_NUMBER" }
          } else {
            $version = $env:GITHUB_REF_NAME
          }
          $version = $version -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$') {
            throw 'Use a version such as v1.0.1, 1.0.1 or v1.0.1-rc.1.'
          }
          "version=$version" >> $env:GITHUB_OUTPUT
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Check core behavior on Windows
        run: dotnet run --project tests/BatteryCharge.Checks/BatteryCharge.Checks.csproj -c Release
      - name: Check Windows UI with simulated device and startup registration
        id: ui_checks
        continue-on-error: true
        run: dotnet run --project tests/BatteryCharge.UiChecks/BatteryCharge.UiChecks.csproj -c Release -- artifacts/ui
      - uses: actions/upload-artifact@v7
        id: ui_screenshots
        continue-on-error: true
        if: always()
        with:
          name: BatteryCharge-ui
          path: artifacts/ui/
          if-no-files-found: warn
      - name: Report advisory UI diagnostics
        if: steps.ui_checks.outcome == 'failure' || steps.ui_screenshots.outcome == 'failure'
        shell: pwsh
        run: |
          Write-Output '::warning::Windows UI diagnostics reported a failure. Review the UI check and screenshot upload logs; publishing will continue.'
          'Windows UI diagnostics reported a failure. Build and release will continue. Review the UI step logs and any available BatteryCharge-ui screenshots.' >> $env:GITHUB_STEP_SUMMARY
      - name: Publish Windows x64 application
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: >-
          dotnet publish src/BatteryCharge.App/BatteryCharge.App.csproj
          -c Release -r win-x64 --self-contained false
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version="$env:RELEASE_VERSION"
          -p:PublishTrimmed=false -p:DebugType=embedded -o artifacts/app
      - name: Package Windows application
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        shell: pwsh
        run: |
          Compress-Archive -Path artifacts/app/* -DestinationPath "artifacts/BatteryCharge-Windows-x64-$env:RELEASE_VERSION.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: BatteryCharge-Windows-x64-${{ steps.release.outputs.version }}
          path: artifacts/BatteryCharge-Windows-x64-${{ steps.release.outputs.version }}.zip
          if-no-files-found: error
      - name: Generate commit notes
        if: github.event_name == 'push' && github.ref_type == 'tag'
        id: changes
        shell: pwsh
        run: |
          python scripts/release-notes.py --tag "$env:GITHUB_REF_NAME" --repository "$env:GITHUB_REPOSITORY" --output artifacts/commit-notes.md
          if ($LASTEXITCODE -ne 0) { throw "Commit notes generation failed ($LASTEXITCODE)." }
      - name: Publish GitHub Release with generated notes
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          PREVIOUS_TAG: ${{ steps.changes.outputs.previous_tag }}
        shell: pwsh
        run: |
          $package = "artifacts/BatteryCharge-Windows-x64-$env:RELEASE_VERSION.zip"
          $existingRelease = gh release view "$env:GITHUB_REF_NAME" --repo "$env:GITHUB_REPOSITORY" --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "$env:GITHUB_REF_NAME" "$package" --repo "$env:GITHUB_REPOSITORY" --clobber
          } else {
            $releaseArgs = @('release', 'create', $env:GITHUB_REF_NAME, $package,
              '--repo', $env:GITHUB_REPOSITORY, '--verify-tag',
              '--title', "BatteryCharge $env:RELEASE_VERSION", '--generate-notes',
              '--notes-file', 'artifacts/commit-notes.md')
            if ($env:PREVIOUS_TAG) { $releaseArgs += @('--notes-start-tag', $env:PREVIOUS_TAG) }
            if ($env:RELEASE_VERSION -match '^\d+\.\d+\.\d+-') { $releaseArgs += '--prerelease' }
            gh @releaseArgs
          }
          if ($LASTEXITCODE -ne 0) { throw "GitHub Release publishing failed ($LASTEXITCODE)." }
